{%- comment -%}
  Home-page figure: one synthetic signal drawn under three constraints, one per research area.
  Labels and captions come from _data/research.yml; the drawing is assets/js/figure.js.
{%- endcomment -%}
<figure class="figure">
  <div class="fig" id="fig">
    <svg class="fig-art" role="img" aria-label="Illustration with synthetic data: a grid of coloured cells showing the same signal under three constraints, limited compute, noisy labels and encrypted data."></svg>
    <div class="fig-legend" aria-hidden="true"></div>
    <div class="fig-bar">
      <div class="seg" role="group" aria-label="Choose a constraint to draw">
        {%- for area in site.data.research %}
        <button type="button" data-fig-mode="{{ area.figure.mode }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">{{ area.figure.label }}</button>
        {%- endfor %}
      </div>
      <button type="button" class="fig-redraw" data-fig-redraw>New sample</button>
      <span class="fig-readout" aria-live="polite"></span>
    </div>
  </div>
  <figcaption class="fig-cap">
    {%- for area in site.data.research %}
    <p data-fig-cap="{{ area.figure.mode }}"{% unless forloop.first %} hidden{% endunless %}><b>{{ area.figure.label }}.</b> {{ area.figure.caption }} <a href="{{ '/research/' | relative_url }}#{{ area.id }}">{{ area.figure.link }}</a></p>
    {%- endfor %}
    <p class="fig-note">Synthetic illustration, redrawn on every visit.</p>
  </figcaption>
</figure>
{%- assign fig_v = site.time | date: "%Y%m%d%H%M" %}
<script src="{{ '/assets/js/figure.js' | relative_url }}?v={{ fig_v }}"></script>
