<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f7fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100e22" media="(prefers-color-scheme: dark)">
{%- assign v = site.time | date: "%Y%m%d%H%M" -%}
{% seo %}
{% feed_meta %}
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/source-sans-3-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ v }}">
<script>
/* Mark that scripts run, and apply a saved theme before first paint. */
document.documentElement.classList.add('js');
try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
{%- if page.url == '/' %}
{% include person-jsonld.html %}
{%- endif %}
{%- if page.math %}
<link rel="stylesheet" href="{{ '/assets/vendor/katex/katex.min.css' | relative_url }}">
<script defer src="{{ '/assets/vendor/katex/katex.min.js' | relative_url }}"></script>
<script defer src="{{ '/assets/vendor/katex/auto-render.min.js' | relative_url }}"></script>
{%- endif %}
