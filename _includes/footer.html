<footer class="foot">
  <div class="foot-inner">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</span>
    {%- if site.posts.size > 0 %}
    <a href="{{ '/feed.xml' | relative_url }}"><svg class="ico"><use href="#i-rss"/></svg>RSS feed</a>
    {%- endif %}
    <span>Last updated: {{ site.time | date: "%B %Y" }}</span>
  </div>
</footer>
