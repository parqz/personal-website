# The tabs in the top bar, in order.
# url: "/#name" jumps to a section of the home page; "/name/" opens a page.
# also: a page on which this tab is also shown as the current one.
# "Blog" and "CV" are added automatically (see blog_in_nav in _config.yml).
- title: About
  url: /#about
- title: Research
  url: /#research
  also: /research/
- title: News
  url: /#news
- title: Publications
  url: /#publications
  also: /publications/
- title: Education
  url: /#education
- title: Experience
  url: /#experience
- title: Honors
  url: /#honors
- title: Service
  url: /#service
