# Publications, newest first.
#
# id:       short unique key; used in links (/publications/#id)
# venue_short: the short label shown on the tile when the paper has no image, e.g. "EMNLP 2026"
# status:   published | accepted (shows "To appear") | under-review | in-preparation
# area:     efficiency | trustworthy | privacy   (must match an id in _data/research.yml)
# links:    all optional. One button leads to the paper itself:
#             paper: the published version (shown as "Paper"), or
#             arxiv: the arXiv page (shown as "arXiv"; used only when there is no "paper" link)
#           and others follow it: code, dataset, slides, poster
#           (a poster kept in this repository is linked as /assets/posters/name.pdf)
# selected: true -> also shown on the home page
# image:    banner or figure shown beside the paper, e.g. /assets/img/papers/nra-embed.png
#           (without one, a coloured tile with the venue name is shown). It sits in a wide frame,
#           so a landscape image works best.
# image_alt: one sentence describing the image, for screen readers
# image_full: optional. A different, larger image that opens when the banner is selected, e.g. the
#           whole poster when the banner shows only part of it. Without it, the banner itself opens.
# award:    optional, e.g. "Best Paper Award"
#
# Papers under anonymous review are not listed here until they are accepted.

